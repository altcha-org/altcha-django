site_name: altcha-django
site_description: Django integration for ALTCHA — Widget v3, Proof-of-Work v2, and Sentinel
# Read the Docs exports the real canonical URL at build time; the fallback keeps
# `mkdocs serve` working locally.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://localhost:8000/"]
theme:
  name: material
  features: [content.code.copy, navigation.sections]
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Local verification: local-verification.md
  - ALTCHA Sentinel: sentinel.md
  - Widget options: widget-options.md
  - Settings reference: settings.md
  - Signals & stats: signals.md
  - System checks: system-checks.md
  - Django REST Framework: drf.md
  - Testing: testing.md
  - Migrating from django-altcha: migrating-from-django-altcha.md
