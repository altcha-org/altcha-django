# Read the Docs build configuration.
# Without this file RTD assumes Sphinx and fails looking for docs/conf.py;
# this project uses MkDocs (mkdocs.yml at the repo root).
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # Equivalent to `mkdocs build --strict`, matching `nox -s docs`, so a broken
  # link or a nav entry pointing at a missing page fails the build.
  fail_on_warning: true

python:
  install:
    # Installs the `docs` extra from pyproject.toml, so the docs dependencies
    # have a single source of truth.
    - method: pip
      path: .
      extra_requirements:
        - docs
