<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>altcha-django demo</title>
  {{ form.media }}{{ formset.media }}
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .5rem; }
    .msg { background: #e6ffed; border: 1px solid #34d058; padding: .75rem; border-radius: 6px; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav><a href="{% url 'contact' %}">Form</a><a href="{% url 'contact-formset' %}">Formset</a><a href="{% url 'stats' %}">Stats JSON</a></nav>
  {% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
