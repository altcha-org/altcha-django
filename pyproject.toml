[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altcha-django"
version = "1.0.0"
description = "Django integration for ALTCHA — Widget v3, Proof-of-Work v2, and Sentinel."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "altcha-django contributors" }]
keywords = ["altcha", "django", "captcha", "proof-of-work", "sentinel", "spam", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "altcha>=2.1.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/altcha-org/altcha-django"
Documentation = "https://github.com/altcha-org/altcha-django#readme"
Source = "https://github.com/altcha-org/altcha-django"
Issues = "https://github.com/altcha-org/altcha-django/issues"
Changelog = "https://github.com/altcha-org/altcha-django/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sentinel = ["httpx>=0.24"]
argon2 = ["argon2-cffi>=21.3"]
drf = ["djangorestframework>=3.14"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "mkdocs-material>=9.5",
    "Django>=4.2",
    "djangorestframework>=3.14",
    "httpx>=0.24",
    "argon2-cffi>=21.3",
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "nox>=2024.4.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/altcha_django"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/example",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/noxfile.py",
]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "DJ", "S", "RUF"]
# RUF012: Django's `default_error_messages` idiom is a plain dict, not ClassVar.
# RUF022: `__all__` is intentionally grouped by concern, not alphabetical.
ignore = ["S101", "RUF012", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DJ", "E501", "RUF059", "ARG001", "PLR2004"]
"example/**" = ["S", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Put the repo root on sys.path so DJANGO_SETTINGS_MODULE ("tests.settings")
# resolves under the `pytest` console script, not just `python -m pytest`
# (which prepends the cwd itself). Needed by CI and by nox.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "altcha_django.contrib.rest_framework"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.coverage.run]
source = ["altcha_django"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
